datasets:
  - id: calibration_grid
    dataset: calibration_grid
    title: Calibration Grid GeoJSON
    description: Deterministic 12.5 m coordinate grid over the table bounds, with 41 lines per axis for projector alignment.
    params:
      divisions: 40
      crs: EPSG:3006
    export:
      format: geojson
      filename: calibration_grid.geojson
      media_type: application/geo+json
      data_kind: vector
      crs: EPSG:3006
    table:
      role: alignment
      dataset_key_suffix: calibration-grid-geojson
      publish: true

  - id: smoke_field_vtu
    dataset: smoke
    title: Smoke Field VTU
    description: Local-only synthetic smoke volume field for inspecting velocity, speed, and pressure values outside the table projector path.
    params:
      product: field
      resolution: 17
    export:
      format: vtu
      filename: smoke_field.vtu
      media_type: application/vnd.vtk.vtu+xml
      data_kind: mesh
    table:
      role: local_reference
      dataset_key_suffix: smoke-field-vtu
      publish: false
      default_enabled: false
      skip_reason: VTU volume fields are local inspection artifacts and are not useful in the projector-table UI.

  - id: smoke_field_pb
    dataset: smoke
    title: Smoke Field Protobuf
    description: Local-only synthetic smoke protobuf package for Dataset v2 serialization checks; not a physical CFD result.
    params:
      product: field
      resolution: 17
    export:
      format: pb
      filename: smoke_field.pb
      media_type: application/x-protobuf
      data_kind: protobuf
    table:
      role: local_reference
      dataset_key_suffix: smoke-field-pb
      publish: false
      default_enabled: false
      skip_reason: Protobuf volume fields are local serialization checks and are not useful in the projector-table UI.

  - id: smoke_slice_geojson
    dataset: smoke
    title: Smoke Slice GeoJSON
    description: Synthetic smoke speed slice exported as GeoJSON for Atlas/table overlay checks.
    params:
      product: slice
      resolution: 31
      slice_axis: z
      slice_position: 0.5
      crs: EPSG:3006
    export:
      format: geojson
      filename: smoke_slice.geojson
      media_type: application/geo+json
      data_kind: vector
      crs: EPSG:3006
    table:
      role: overlay
      dataset_key_suffix: smoke-slice-geojson
      publish: true

  - id: smoke_streamlines_geojson
    dataset: smoke
    title: Smoke Streamlines GeoJSON
    description: Synthetic smoke streamlines exported as GeoJSON for flow-direction overlay checks.
    params:
      product: streamlines
      streamline_count: 25
      streamline_steps: 120
      crs: EPSG:3006
    export:
      format: geojson
      filename: smoke_streamlines.geojson
      media_type: application/geo+json
      data_kind: vector
      crs: EPSG:3006
    table:
      role: overlay
      dataset_key_suffix: smoke-streamlines-geojson
      publish: true

  - id: smoke_slice
    dataset: smoke
    title: Smoke Slice PNG
    description: Table-projection PNG showing synthetic smoke speed on a horizontal slice; a UX fixture, not validated CFD.
    params:
      product: slice
      resolution: 128
      slice_axis: z
      slice_position: 0.5
      profile: table
      width: 1920
      height: 1920
    export:
      format: png
      filename: smoke_slice.png
      media_type: image/png
      data_kind: raster
      crs: EPSG:3006
    table:
      role: projection
      dataset_key_suffix: smoke-slice-png
      publish: true

  - id: smoke_streamlines
    dataset: smoke
    title: Smoke Streamlines PNG
    description: Table-projection PNG showing synthetic smoke streamlines for flow-direction UX checks; not validated CFD.
    params:
      product: streamlines
      streamline_count: 64
      streamline_steps: 180
      profile: table
      width: 1920
      height: 1920
    export:
      format: png
      filename: smoke_streamlines.png
      media_type: image/png
      data_kind: raster
      crs: EPSG:3006
    table:
      role: projection
      dataset_key_suffix: smoke-streamlines-png
      publish: true

  - id: smoke_streamlines_mp4
    dataset: smoke
    title: Smoke Streamlines MP4
    description: Optional synthetic smoke streamline MP4 loop for motion UX checks; disabled by default because video encoding is extra runtime surface.
    params:
      product: streamlines
      streamline_count: 48
      streamline_steps: 150
      profile: table
      width: 1920
      height: 1920
      fps: 30
      duration: 8.0
      period: 8.0
    export:
      format: mp4
      filename: smoke_streamlines.mp4
      media_type: video/mp4
      data_kind: video
      crs: EPSG:3006
    table:
      role: projection_video
      dataset_key_suffix: smoke-streamlines-mp4
      publish: true
      default_enabled: false
      skip_reason: MP4 rendering is intentionally opt-in because it requires video encoding support.

  - id: footprints_geojson
    dataset: building_footprints
    title: Building Footprints GeoJSON
    description: Cached/live building footprints over the table bounds for physical alignment; source and license review required before default publishing.
    params:
      source: LM
      crs: EPSG:3006
    export:
      format: geojson
      filename: building_footprints.geojson
      media_type: application/geo+json
      data_kind: vector
      crs: EPSG:3006
    table:
      role: alignment_context
      dataset_key_suffix: footprints-geojson
      publish: true
      default_enabled: false
      requires_network: true
      skip_reason: Default generation stays disabled because footprint output depends on provider/cache availability and source-term review.
